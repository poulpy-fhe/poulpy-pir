[package]
name = "poulpy-pir"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Single-server, communication-efficient private information retrieval with server-side preprocessing."
license = "Apache-2.0"
repository = "https://github.com/poulpy-fhe/poulpy-pir"
homepage = "https://github.com/poulpy-fhe/poulpy-pir"
documentation = "https://docs.rs/poulpy-pir"
readme = "README.md"
keywords = ["pir", "fhe", "cryptography", "privacy"]
categories = ["cryptography", "algorithms"]
include = [
    "Cargo.toml",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "RECURSION_RAM_MODEL.md",
    "RELEASE.md",
    "SECURITY.md",
    "table2_db_parameters.md",
    "build.rs",
    "src/**",
    "examples/**",
    "benches/**",
]

[workspace]
exclude = ["vendor/ptr_hash"]

# The MPHF's portable wire format lives in this fork; see vendor/ptr_hash/FORK.md.
# A workspace that depends on this crate must repeat this patch — Cargo only
# honours [patch] from the workspace root being built.
[patch.crates-io]
ptr_hash = { path = "vendor/ptr_hash" }

[dependencies]
getrandom = "0.4.3"
# Minimal perfect hashing for keyword PIR (`src/keyword`). The MPHF ships to
# clients through `write_portable`, not epserde, so that a 64-bit server and a
# 32-bit wasm client agree on the bytes.
ptr_hash = { version = "2.0.2", default-features = false }
poulpy-core = "0.7.0"
poulpy-hal = "0.7.0"
poulpy-cpu-ref = { version = "0.7.0", features = ["enable-core"] }
poulpy-cpu-avx = { version = "0.7.0", features = ["enable-avx"], optional = true }
# AVX-512 FHE backend (FFT64Avx512). Optional and never named in the library —
# only the `pir` example (a run-site "binary") imports it, gated by the
# `avx512-fhe` feature. `enable-avx512f` suffices (FFT64Avx512 needs only
# AVX-512F). NOTE: this crate has a compile-time guard requiring
# `RUSTFLAGS="-C target-feature=+avx512f"`, so it only *builds* on an AVX-512F host.
poulpy-cpu-avx512 = { version = "0.7.0", features = ["enable-avx512f"], optional = true }

# Raw x86-64 assembly; target-gated so other targets build the portable fallback.
[target.'cfg(target_arch = "x86_64")'.dependencies]
private-gemm-x86 = { version = "=0.1.20", default-features = false }

[features]
# Pulls in the optional AVX2/FMA FHE backend used by tests, benches, and the
# default keyword example backend. Build on an AVX2/FMA host with:
#   RUSTFLAGS="-C target-feature=+avx2,+fma" cargo test --features avx2-fhe
avx2-fhe = ["dep:poulpy-cpu-avx"]
# Pulls in the optional AVX-512 FHE backend for the `pir` example.
# Build/run on an AVX-512F host with:
#   RUSTFLAGS="-C target-feature=+avx512f" cargo run --release --features avx512-fhe --example pir -- <preset>
avx512-fhe = ["dep:poulpy-cpu-avx512"]
# Expose `CblasDgemm`, a `Gemm` backend for the offline mask product backed by
# the system CBLAS (`cblas_dgemm`). Links `libopenblas` — install the *pthread*
# build (Ubuntu: `libopenblas-pthread-dev`) and run with
# `OPENBLAS_NUM_THREADS=1` set in the environment (constructor-read: it must
# be set before the process starts; the examples re-exec to enforce it). The
# server fans dgemm out across its own workers, and only the pthread build's
# buffer pool is locked for concurrent callers (Debian's "serial" build
# corrupts results under concurrent use — measured); the env var keeps that
# build from spawning its 1-per-CPU spin-waiting pool, which otherwise slows
# even non-BLAS phases (~2x on the single-threaded online path — measured).
# build.rs probes the distro's off-path pthread directories and fails early if
# the optimized OpenBLAS library is missing. Set `CBLAS_LIB_DIR` /
# `CBLAS_LIB_NAME` explicitly only for another known optimized,
# concurrent-caller-safe CBLAS. Motivation: on wide-AVX-512 cores (Granite
# Rapids c8i: 3×512-bit FMA pipes) OpenBLAS's dgemm sustains ~1.5-1.7×
# private-gemm-x86's throughput at the 2048³ PIR shape.
cblas-gemm = []
# Pin the database pages across NUMA nodes with mbind(MPOL_INTERLEAVE) at
# allocation (Linux/x86-64). Choose per deployment: single-query latency on
# multi-socket hosts improves ~7x (memory-bound l1 body product runs at every
# node's bandwidth instead of one), but batched serving loses ~12% (automatic
# NUMA balancing migrating hot DB blocks adaptively beats any static placement
# for the batched pipeline). Off = batch-throughput tuning (the default).
numa-db-interleave = []

[[example]]
name = "pir"
path = "examples/pir.rs"
required-features = ["avx512-fhe"]

# Keyword PIR (lookup by ETH address through the MPHF in `src/keyword`).
# Defaults to the scalar reference backend; add `--features avx2-fhe` with
# AVX2/FMA RUSTFLAGS for FFT64Avx, or `--features avx512-fhe` for FFT64Avx512.
[[example]]
name = "key_word_pir"
path = "examples/key_word_pir.rs"

[[bench]]
name = "packing"
path = "benches/packing/main.rs"
harness = false
required-features = ["avx2-fhe"]

[[bench]]
name = "poly_eval"
path = "benches/poly_eval/main.rs"
harness = false
required-features = ["avx2-fhe"]

[[bench]]
name = "mask_product"
path = "benches/mask_product/main.rs"
harness = false

[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
private-gemm-x86 = { version = "=0.1.20", default-features = false }
