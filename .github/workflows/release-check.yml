name: Release Check

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C target-feature=+avx2,+fma

jobs:
  release:
    name: release readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Check all targets
        run: cargo check --all-targets --features avx2-fhe
      - name: Clippy
        run: cargo clippy --all-targets --features avx2-fhe -- -D warnings
      - name: Full library tests
        run: cargo test --release --lib --features avx2-fhe
      - name: Docs
        run: cargo doc --no-deps
      - name: Package dry run
        run: cargo package
