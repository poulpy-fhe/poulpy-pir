name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fast:
    name: fast checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # poulpy-hal uses #![feature(trait_alias)], so the whole tree needs the
      # nightly pinned in rust-toolchain.toml (rustup reads it automatically).
      - name: Install Rust
        run: |
          rustup toolchain install nightly-2026-05-14 --profile minimal --component rustfmt,clippy
          rustup default nightly-2026-05-14
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Fast API and wire tests
        run: |
          cargo test api_errors --lib
          cargo test wire_bounds --lib
      - name: Docs
        run: cargo doc --no-deps
